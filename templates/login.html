<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Trekso | Applicant Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="main-nav">

    <a href="/" class="brand">

        <img
            src="{{ url_for('static', filename='images/trekso-logo.png') }}"
            alt="Trekso Logo"
        >

    </a>

    <div class="nav-links">

        <a href="{{ url_for('register') }}"
           class="nav-link nav-register">
            Register
        </a>

        <a href="{{ url_for('admin_login') }}"
           class="nav-link nav-admin">
            Admin Login
        </a>

    </div>

</nav>


<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">

            <img
                src="{{ url_for('static', filename='images/trekso-logo.png') }}"
                alt="Trekso"
            >

        </div>

        <div class="auth-icon">
            👤
        </div>

        <h1>
            Applicant Login
        </h1>

        <p class="auth-subtitle">
            Trekso Careers
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('login') }}"
        >

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your registered email"
                    required
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                class="auth-submit"
            >
                Login to Trekso Careers
            </button>

        </form>


        <a
            href="{{ url_for('register') }}"
            class="auth-footer-link"
        >
            Don't have an account? Register
        </a>


        <div class="security-note">
            Use the email and password you used during registration.
        </div>


        <a
            href="/"
            class="auth-footer-link"
        >
            ← Back to Trekso Careers
        </a>

    </div>

</div>


<footer class="site-footer">

    © 2026 Trekso. All rights reserved.

</footer>

</body>

</html>

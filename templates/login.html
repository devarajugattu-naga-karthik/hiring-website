<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Teckso | Admin Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ==========================
           NAVBAR
           ========================== */

        nav {
            background: white;
            height: 72px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow:
                0 2px 12px rgba(0,0,0,0.06);
        }

        .logo {
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-mark {
            width: 40px;
            height: 40px;
            border-radius: 9px;
            background: #123c69;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 19px;
        }

        .logo-text {
            color: #123c69;
            font-size: 24px;
            font-weight: 800;
        }

        .home-link {
            text-decoration: none;
            color: #123c69;
            font-weight: 600;
        }

        /* ==========================
           LOGIN AREA
           ========================== */

        .page {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-card {
            width: 430px;
            max-width: 100%;
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow:
                0 10px 35px rgba(18,60,105,0.10);
        }

        .icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 20px;
            border-radius: 12px;
            background: #e7f0fa;
            color: #123c69;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 27px;
        }

        h1 {
            text-align: center;
            color: #123c69;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .error {
            background: #fde2e2;
            color: #b42318;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        label {
            display: block;
            color: #374151;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            margin-bottom: 18px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow:
                0 0 0 3px rgba(37,99,235,0.10);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #123c69;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #0d2d50;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #123c69;
            text-decoration: none;
            font-weight: 600;
        }

        .security-note {
            margin-top: 22px;
            padding: 12px;
            background: #f5f8fc;
            border-radius: 7px;
            color: #6b7280;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
        }

        /* ==========================
           FOOTER
           ========================== */

        footer {
            background: #0c2947;
            color: #dbe8f5;
            text-align: center;
            padding: 20px;
            font-size: 13px;
        }

        @media (max-width: 500px) {

            .login-card {
                padding: 28px 22px;
            }

            .logo-text {
                font-size: 20px;
            }

        }

    </style>

</head>


<body>


<!-- ==========================
     NAVBAR
     ========================== -->

<nav>

    <a href="/" class="logo">

        <div class="logo-mark">
            T
        </div>

        <div class="logo-text">
            TECKSO
        </div>

    </a>

    <a
        href="/"
        class="home-link"
    >
        ← Home
    </a>

</nav>


<!-- ==========================
     LOGIN
     ========================== -->

<div class="page">

    <div class="login-card">

        <div class="icon">
            🔐
        </div>

        <h1>
            Admin Login
        </h1>

        <p class="subtitle">
            Teckso Hiring Portal
        </p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="/admin-login"
        >

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter admin username"
                required
                autocomplete="username"
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                required
                autocomplete="current-password"
            >


            <button type="submit">
                Login to Admin Dashboard
            </button>

        </form>


        <div class="security-note">
            Authorized Teckso administrators only.
        </div>


        <a
            href="/"
            class="back"
        >
            ← Back to Teckso Careers
        </a>

    </div>

</div>


<!-- ==========================
     FOOTER
     ========================== -->

<footer>

    © 2026 Teckso. All rights reserved.

</footer>


</body>

</html>

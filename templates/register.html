<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Teckso | Applicant Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="main-nav">

    <a href="/" class="brand">

        <img
            src="{{ url_for('static', filename='images/teckso-logo.png') }}"
            alt="Teckso Logo"
        >

    </a>

    <div class="nav-links">

        <a href="{{ url_for('login') }}"
           class="nav-link nav-applicant">
            Applicant Login
        </a>

        <a href="{{ url_for('admin_login') }}"
           class="nav-link nav-admin">
            Admin Login
        </a>

    </div>

</nav>


<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">

            <img
                src="{{ url_for('static', filename='images/teckso-logo.png') }}"
                alt="Teckso"
            >

        </div>

        <h1>
            Create Your Account
        </h1>

        <p class="auth-subtitle">
            Apply for opportunities at Teckso
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('register') }}"
        >

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    class="form-control"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label for="mobile">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    class="form-control"
                    placeholder="Enter your mobile number"
                    required
                    autocomplete="tel"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Create a password"
                    required
                    autocomplete="new-password"
                >

            </div>


            <button
                type="submit"
                class="auth-submit"
            >
                Create Account
            </button>

        </form>


        <a
            href="{{ url_for('login') }}"
            class="auth-footer-link"
        >
            Already have an account? Login
        </a>


        <div class="security-note">
            Your password is securely hashed before storage.
        </div>

    </div>

</div>


<footer class="site-footer">

    © 2026 Teckso. All rights reserved.

</footer>

</body>

</html>

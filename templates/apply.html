<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Job Application</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        nav {
            background: #123c69;
            color: white;

            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            font-size: 22px;
        }

        .logout {
            background: #d9534f;
            color: white;
            text-decoration: none;

            padding: 10px 18px;

            border-radius: 5px;
        }

        .container {
            max-width: 950px;

            margin: 40px auto;

            padding: 20px;
        }

        .form-box {
            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 4px 18px rgba(0,0,0,0.08);
        }

        .title {
            text-align: center;

            margin-bottom: 30px;
        }

        .title h1 {
            color: #123c69;

            margin-bottom: 8px;
        }

        .title p {
            color: #777;
        }

        .section-title {
            color: #123c69;

            border-bottom: 2px solid #eee;

            padding-bottom: 10px;

            margin: 30px 0 20px;
        }

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }

        .form-group {
            display: flex;

            flex-direction: column;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;

            margin-bottom: 7px;

            color: #444;
        }

        .required {
            color: red;
        }

        input,
        select,
        textarea {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;

            font-family: Arial, sans-serif;
        }

        input:focus,
        select:focus,
        textarea:focus {

            outline: none;

            border-color: #123c69;

            box-shadow:
                0 0 0 2px rgba(18,60,105,0.1);
        }

        textarea {
            min-height: 110px;

            resize: vertical;
        }

        .help-text {
            font-size: 12px;

            color: #777;

            margin-top: 5px;
        }

        .resume-box {

            background: #f8f9fa;

            border: 1px dashed #aaa;

            padding: 20px;

            border-radius: 8px;

            margin-top: 5px;
        }

        .submit-area {

            margin-top: 35px;

            text-align: center;

            border-top: 1px solid #eee;

            padding-top: 25px;
        }

        .submit-btn {

            background: #123c69;

            color: white;

            border: none;

            padding: 14px 45px;

            border-radius: 7px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .submit-btn:hover {

            background: #0d2d50;

        }

        .back {

            display: block;

            margin-top: 20px;

            text-align: center;

            color: #123c69;

            text-decoration: none;

            font-weight: bold;
        }

        @media (max-width: 700px) {

            nav {
                padding: 15px 20px;
            }

            nav h2 {
                font-size: 18px;
            }

            .form-box {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

        }

    </style>

</head>


<body>

    <!-- Navigation -->

    <nav>

        <h2>
            Company Hiring Portal
        </h2>

        <a
            href="/logout"
            class="logout">

            Logout

        </a>

    </nav>


    <div class="container">

        <div class="form-box">

            <div class="title">

                <h1>
                    Job Application Form
                </h1>

                <p>
                    Please provide accurate information.
                </p>

            </div>


            <form
                method="POST"
                enctype="multipart/form-data">


                <!-- JOB DETAILS -->

                <h2 class="section-title">
                    Job Details
                </h2>

                <div class="form-grid">

                    <div class="form-group full">

                        <label>
                            Position Applying For
                            <span class="required">*</span>
                        </label>

                        <select
                            name="position"
                            required>

                            <option value="">
                                -- Select Position --
                            </option>

                            <option value="Software Developer">
                                Software Developer
                            </option>

                            <option value="Web Developer">
                                Web Developer
                            </option>

                            <option value="Python Developer">
                                Python Developer
                            </option>

                            <option value="Java Developer">
                                Java Developer
                            </option>

                            <option value="Data Analyst">
                                Data Analyst
                            </option>

                            <option value="Data Scientist">
                                Data Scientist
                            </option>

                            <option value="Testing Engineer">
                                Testing Engineer
                            </option>

                            <option value="Cloud Engineer">
                                Cloud Engineer
                            </option>

                        </select>

                    </div>

                </div>


                <!-- PERSONAL DETAILS -->

                <h2 class="section-title">
                    Personal Details
                </h2>

                <div class="form-grid">

                    <div class="form-group">

                        <label>
                            Full Name
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            name="name"
                            value="{{ session['user_name'] }}"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            Email
                            <span class="required">*</span>
                        </label>

                        <input
                            type="email"
                            name="email"
                            value="{{ session['user_email'] }}"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            Mobile Number
                            <span class="required">*</span>
                        </label>

                        <input
                            type="tel"
                            name="mobile"
                            value="{{ session['user_mobile'] }}"
                            pattern="[0-9]{10}"
                            maxlength="10"
                            required>

                        <span class="help-text">
                            Enter 10-digit mobile number
                        </span>

                    </div>


                    <div class="form-group">

                        <label>
                            Date of Birth
                            <span class="required">*</span>
                        </label>

                        <input
                            type="date"
                            name="dob"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            Gender
                            <span class="required">*</span>
                        </label>

                        <select
                            name="gender"
                            required>

                            <option value="">
                                -- Select Gender --
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>

                </div>


                <!-- EDUCATION -->

                <h2 class="section-title">
                    Education Details
                </h2>

                <div class="form-grid">

                    <div class="form-group">

                        <label>
                            Highest Qualification
                            <span class="required">*</span>
                        </label>

                        <select
                            name="qualification"
                            required>

                            <option value="">
                                -- Select Qualification --
                            </option>

                            <option value="B.Tech">
                                B.Tech
                            </option>

                            <option value="B.E">
                                B.E
                            </option>

                            <option value="B.Sc">
                                B.Sc
                            </option>

                            <option value="BCA">
                                BCA
                            </option>

                            <option value="M.Tech">
                                M.Tech
                            </option>

                            <option value="MCA">
                                MCA
                            </option>

                            <option value="M.Sc">
                                M.Sc
                            </option>

                            <option value="MBA">
                                MBA
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Branch / Specialization
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            name="branch"
                            placeholder="Example: Information Technology"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            Graduation Year
                            <span class="required">*</span>
                        </label>

                        <select
                            name="graduation_year"
                            required>

                            <option value="">
                                -- Select Year --
                            </option>

                            <option value="2024">
                                2024
                            </option>

                            <option value="2025">
                                2025
                            </option>

                            <option value="2026">
                                2026
                            </option>

                            <option value="2027">
                                2027
                            </option>

                            <option value="2028">
                                2028
                            </option>

                        </select>

                    </div>

                </div>


                <!-- EXPERIENCE -->

                <h2 class="section-title">
                    Experience & Skills
                </h2>

                <div class="form-grid">

                    <div class="form-group">

                        <label>
                            Candidate Type
                            <span class="required">*</span>
                        </label>

                        <select
                            name="candidate_type"
                            required>

                            <option value="">
                                -- Select --
                            </option>

                            <option value="Fresher">
                                Fresher
                            </option>

                            <option value="Experienced">
                                Experienced
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Years of Experience
                        </label>

                        <input
                            type="number"
                            name="experience"
                            min="0"
                            max="50"
                            placeholder="0">

                    </div>


                    <div class="form-group full">

                        <label>
                            Technical Skills
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            name="skills"
                            placeholder="Example: Python, Java, SQL, HTML, CSS"
                            required>

                    </div>

                </div>


                <!-- ADDRESS -->

                <h2 class="section-title">
                    Address
                </h2>

                <div class="form-grid">

                    <div class="form-group full">

                        <label>
                            Complete Address
                            <span class="required">*</span>
                        </label>

                        <textarea
                            name="address"
                            placeholder="Enter your complete address"
                            required></textarea>

                    </div>

                </div>


                <!-- RESUME -->

                <h2 class="section-title">
                    Resume
                </h2>

                <div class="form-grid">

                    <div class="form-group full">

                        <label>
                            Upload Resume
                            <span class="required">*</span>
                        </label>

                        <div class="resume-box">

                            <input
                                type="file"
                                name="resume"
                                accept=".pdf,.doc,.docx"
                                required>

                            <p class="help-text">
                                Accepted formats: PDF, DOC, DOCX.
                                Maximum size: 5 MB.
                            </p>

                        </div>

                    </div>

                </div>


                <!-- SUBMIT -->

                <div class="submit-area">

                    <button
                        type="submit"
                        class="submit-btn">

                        Submit Application

                    </button>

                </div>


                <a
                    href="/applicant-home"
                    class="back">

                    ← Back to Dashboard

                </a>

            </form>

        </div>

    </div>

</body>

</html>

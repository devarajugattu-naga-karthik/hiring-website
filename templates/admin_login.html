<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Teckso | Admin Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="main-nav">

    <a href="/" class="brand">

        <img
            src="{{ url_for('static', filename='images/teckso-logo.png') }}"
            alt="Teckso Logo"
        >

    </a>

    <div class="nav-links">

        <a
            href="{{ url_for('login') }}"
            class="nav-link nav-applicant"
        >
            Applicant Login
        </a>

        <a
            href="{{ url_for('register') }}"
            class="nav-link nav-register"
        >
            Register
        </a>

    </div>

</nav>


<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">

            <img
                src="{{ url_for('static', filename='images/teckso-logo.png') }}"
                alt="Teckso Logo"
            >

        </div>


        <div class="auth-icon">
            🔐
        </div>


        <h1>
            Admin Login
        </h1>


        <p class="auth-subtitle">
            Teckso Hiring Portal
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('admin_login') }}"
        >

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    placeholder="Enter admin username"
                    required
                    autocomplete="username"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter admin password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                class="auth-submit"
            >
                Login to Admin Dashboard
            </button>

        </form>


        <div class="security-note">
            Authorized Teckso administrators only.
        </div>


        <a
            href="/"
            class="auth-footer-link"
        >
            ← Back to Teckso Careers
        </a>

    </div>

</div>


<footer class="site-footer">

    © 2026 Teckso. All rights reserved.

</footer>

</body>

</html>

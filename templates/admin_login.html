<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;

            background: white;

            padding: 40px;

            border-radius: 10px;

            box-shadow:
                0 4px 20px rgba(0,0,0,0.1);
        }

        .logo {
            text-align: center;

            font-size: 45px;

            margin-bottom: 10px;
        }

        h1 {
            text-align: center;

            color: #123c69;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;

            margin-bottom: 20px;
        }

        input:focus {
            border-color: #123c69;

            outline: none;
        }

        button {
            width: 100%;

            padding: 13px;

            background: #123c69;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #0d2d50;
        }

        .error {
            background: #f8d7da;

            color: #842029;

            padding: 12px;

            border-radius: 6px;

            margin-bottom: 20px;

            text-align: center;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #123c69;

            text-decoration: none;

            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <div class="logo">
            🔐
        </div>

        <h1>
            Admin Login
        </h1>

        <p class="subtitle">
            Company Hiring Portal
        </p>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form method="POST" action="/admin-login">

            <label for="username">
                Admin Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter admin username"
                required
            >

            <label for="password">
                Admin Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                required
            >

            <button type="submit">
                Login as Admin
            </button>

        </form>

        <a
            href="/"
            class="back">
            ← Back to Home
        </a>

    </div>

</body>

</html>
